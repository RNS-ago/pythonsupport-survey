# Installed to /etc/nginx/sites-available/pis-survey by setup.sh, with __DOMAIN__ filled in.
# certbot then adds the HTTPS server block to the installed copy, so update.sh never overwrites it.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /srv/pythonsupport-survey/frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/csv;

    # Django (gunicorn)
    location /api/   { proxy_pass http://127.0.0.1:8000; include proxy_params; }
    location /admin/ { proxy_pass http://127.0.0.1:8000; include proxy_params; }

    # The admin's CSS/JS, copied here by `manage.py collectstatic`
    location /static/ { alias /srv/pythonsupport-survey/backend/staticfiles/; }

    # Everything else is a frontend file
    location / { try_files $uri $uri/ =404; }
}
