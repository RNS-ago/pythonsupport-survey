<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- "light dark" follows the device; the theme button writes "light" or "dark" here to override it. -->
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --surface-light: $surface_light;
      --surface-dark: $surface_dark;
      --ink-light: $ink_light;
      --ink-dark: $ink_dark;
      --accent: $accent;
    }

    $page_css
  </style>
  <script type="text/javascript">
    $vegaembed_script
  </script>
</head>
<body>
<button id="theme" type="button">
  <!-- Lucide's moon and sun icons (ISC license) -->
  <span class="to-dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
    <span class="visually-hidden">Switch to dark theme</span>
  </span>
  <span class="to-light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    <span class="visually-hidden">Switch to light theme</span>
  </span>
</button>
<div class="vega-visualization" id="vis"></div>
<div id="filters" role="group" aria-label="Filters"></div>
<script type="text/javascript">
  const spec = $spec;
  const embedOpt = $embed_options;
  // The notebook's GROW, by each chart's width signal: its share of the window's width beyond what the page was built for.
  const grow = $grow;
  // The notebook's AXES: each chart with its y axis inside it, by name, and the signal with that axis's width.
  const axes = $axes;
  // The notebook's FILTER_LABELS: each filter's selection, by name, and what the list of filters calls it.
  const filterLabels = $filters;
  // The notebook's LEGENDS: each chart whose legend filters, by name, the pick a click on an entry makes, and the
  // values entries pick when not their own.
  const legends = $legends;
</script>
<script type="text/javascript">
  $page_js
</script>
</body>
</html>
